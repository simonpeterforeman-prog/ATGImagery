<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATG Object Imagery Library</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #fff; color: #1a1a1a; display: flex; height: 100vh; overflow: hidden; }

  /* Left Nav */
  nav {
    width: 260px; min-width: 260px; background: #f0f0f0;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  nav .logo {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
    color: #1a1a1a; padding: 32px 24px 8px;
  }
  nav .logo-sub {
    font-size: 10px; font-weight: 400; text-transform: uppercase; letter-spacing: 1.5px;
    color: #999; padding: 0 24px 24px;
  }
  nav .divider { height: 1px; background: #ddd; margin: 0 24px; }
  nav ul { list-style: none; padding: 16px 0; }
  nav li {
    padding: 12px 24px; font-size: 13px; font-weight: 500; cursor: pointer;
    color: #666; transition: all 0.2s;
    display: flex; justify-content: space-between; align-items: center;
    letter-spacing: 0.3px;
  }
  nav li:hover { color: #1a1a1a; background: #e4e4e4; }
  nav li.active { color: #1a1a1a; background: #e0e0e0; border-left: 3px solid #1a1a1a; padding-left: 21px; font-weight: 700; }
  nav li .count {
    font-size: 10px; font-weight: 600; color: #999;
    border: 1px solid #ccc; border-radius: 12px; padding: 2px 8px;
    letter-spacing: 0.5px;
  }
  nav li.active .count { color: #666; border-color: #aaa; }
  nav li .mix {
    font-size: 10px; font-weight: 400; color: #aaa;
    margin-left: 6px;
  }
  nav li .spend-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-right: 8px;
  }
  .spend-essential { background: #4CAF50; }
  .spend-semi { background: #FFB300; }
  .spend-discretionary { background: #EF5350; }
  nav .legend {
    padding: 16px 24px 24px; font-size: 10px; color: #999;
    letter-spacing: 0.5px; line-height: 1.8;
  }
  nav .legend-item {
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
  }
  nav .legend-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .spend-tag {
    display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; padding: 3px 10px; border-radius: 2px;
  }
  .spend-tag.essential { background: #E8F5E9; color: #2E7D32; }
  .spend-tag.semi { background: #FFF8E1; color: #F57F17; }
  .spend-tag.discretionary { background: #FFEBEE; color: #C62828; }

  /* Hamburger */
  .hamburger {
    display: none; position: fixed; top: 16px; left: 16px; z-index: 60;
    width: 36px; height: 36px; background: #1a1a1a; border: none; border-radius: 4px;
    cursor: pointer; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  }
  .hamburger span {
    display: block; width: 18px; height: 2px; background: #fff; transition: all 0.3s;
  }
  .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(2.5px, 2.5px); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(2.5px, -2.5px); }
  .nav-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 49;
  }
  .nav-overlay.open { display: block; }

  /* Main Content */
  main {
    flex: 1; overflow-y: auto; padding: 48px 56px; background: #fff;
  }
  .category-header {
    font-size: 42px; font-weight: 900; margin-bottom: 12px; color: #1a1a1a;
    letter-spacing: -1px; line-height: 1.1;
  }
  .category-meta {
    font-size: 12px; color: #999; margin-bottom: 48px;
    text-transform: uppercase; letter-spacing: 1px; font-weight: 500;
  }
  .category-meta span { margin-right: 24px; }
  .category-meta strong { color: #1a1a1a; font-weight: 700; }

  /* Item Type Columns */
  .types-grid {
    display: flex; gap: 20px; overflow-x: auto; padding-bottom: 24px;
  }
  .type-column {
    min-width: 110px; max-width: 135px; flex-shrink: 0;
  }
  .type-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: #1a1a1a; padding-bottom: 10px; margin-bottom: 14px;
    border-bottom: 1px solid #1a1a1a;
  }
  .image-stack {
    display: flex; flex-direction: column; gap: 10px;
  }
  .image-card {
    background: #f7f7f7; border-radius: 4px; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer; border: 1px solid #eee;
  }
  .image-card:hover {
    transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  }
  .image-card.winner {
    border: 2px solid #1a1a1a;
  }
  .image-card.winner .label {
    color: #1a1a1a; font-weight: 700;
  }
  .image-card img {
    width: 100%; height: auto; display: block; background: #f7f7f7;
  }
  .image-card .label {
    font-size: 10px; color: #999; padding: 6px 8px; text-align: center;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    z-index: 100; align-items: center; justify-content: center; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 90vw; max-height: 90vh; border-radius: 2px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .lightbox-close {
    position: absolute; top: 24px; right: 28px; font-size: 28px; color: #fff;
    cursor: pointer; line-height: 1; font-weight: 300;
  }
  .lightbox-meta {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.5); font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.5px; font-weight: 500;
  }

  /* Empty state */
  .empty {
    color: #ccc; font-size: 13px; text-align: center; padding: 80px 20px;
    text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
  nav::-webkit-scrollbar-thumb { background: #ccc; }

  /* Mobile */
  @media (max-width: 768px) {
    .hamburger { display: flex; }
    nav {
      position: fixed; left: -280px; top: 0; bottom: 0; z-index: 50;
      width: 280px; min-width: 280px;
      transition: left 0.3s ease; box-shadow: none;
    }
    nav.open { left: 0; box-shadow: 4px 0 20px rgba(0,0,0,0.15); }
    main {
      padding: 72px 20px 32px; width: 100%;
    }
    .category-header { font-size: 28px; margin-bottom: 8px; }
    .category-meta { font-size: 11px; margin-bottom: 24px; }
    .category-meta span { display: block; margin-bottom: 4px; }
    .types-grid { gap: 16px; }
    .type-column { min-width: 100px; max-width: 120px; }
  }
</style>
</head>
<body>

<!-- Password Gate -->
<div id="pw-gate" style="display:flex; position:fixed; inset:0; z-index:999; background:#1a1a1a; align-items:center; justify-content:center; flex-direction:column;">
  <div style="text-align:center; max-width:340px;">
    <div style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:2px; color:#fff; margin-bottom:4px;">MCD Partners</div>
    <div style="font-size:10px; font-weight:400; text-transform:uppercase; letter-spacing:1.5px; color:rgba(255,255,255,0.4); margin-bottom:48px;">ATG Object Imagery</div>
    <input id="pw-input" type="password" placeholder="Password" autofocus
      style="width:100%; padding:14px 16px; font-size:14px; font-family:'Inter',sans-serif; background:transparent; border:1px solid rgba(255,255,255,0.2); border-radius:0; color:#fff; text-align:center; margin-bottom:16px; outline:none; letter-spacing:1px;"
      onkeydown="if(event.key==='Enter')checkPw()" onfocus="this.style.borderColor='rgba(255,255,255,0.5)'" onblur="this.style.borderColor='rgba(255,255,255,0.2)'">
    <button onclick="checkPw()"
      style="width:100%; padding:14px; font-size:11px; font-weight:700; font-family:'Inter',sans-serif; background:#fff; color:#1a1a1a; border:none; border-radius:0; cursor:pointer; text-transform:uppercase; letter-spacing:2px;">
      Continue
    </button>
    <p id="pw-error" style="color:#ff4444; font-size:11px; margin-top:16px; display:none; text-transform:uppercase; letter-spacing:1px;">Incorrect password</p>
  </div>
</div>

<script>
function checkPw() {
  const pw = document.getElementById('pw-input').value;
  if (pw === 'atg2026') {
    document.getElementById('pw-gate').style.display = 'none';
    sessionStorage.setItem('atg-auth', 'true');
  } else {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}
if (sessionStorage.getItem('atg-auth') === 'true') {
  document.getElementById('pw-gate').style.display = 'none';
}
</script>

const navList = document.getElementById('nav-list');
const content = document.getElementById('content');
let activeCategory = null;

// Build nav — sorted by MCC sales mix descending
const sortedCats = Object.keys(DATA).sort((a, b) => parseFloat(b && DATA[b].meta.mix) - parseFloat(a && DATA[a].meta.mix));
sortedCats.forEach(cat => {
  const totalImages = Object.values(DATA[cat].types).reduce((sum, arr) => sum + arr.length, 0);
  const li = document.createElement('li');
  const spendClass = DATA[cat].meta.spend === 'essential' ? 'spend-essential' : DATA[cat].meta.spend === 'semi' ? 'spend-semi' : 'spend-discretionary';
  li.innerHTML = `<span class="spend-dot ${spendClass}"></span>${cat}<span class="mix">${DATA[cat].meta.mix}</span> <span class="count">${totalImages}</span>`;
  li.dataset.cat = cat;
  li.onclick = () => selectCategory(cat);
  navList.appendChild(li);
});

function selectCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('nav li').forEach(el => el.classList.toggle('active', el.dataset.cat === cat));
  // Close nav on mobile
  if (window.innerWidth <= 768) {
    document.getElementById('nav').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
    document.getElementById('nav-overlay').classList.remove('open');
  }

  const d = DATA[cat];
  const typeCount = Object.keys(d.types).length;

  const spendCls = d.meta.spend === 'essential' ? 'essential' : d.meta.spend === 'semi' ? 'semi' : 'discretionary';
  const spendLabel = d.meta.spend === 'essential' ? 'Essential' : d.meta.spend === 'semi' ? 'Semi-discretionary' : 'Discretionary';

  let html = `
    <div class="category-header">${cat}.</div>${d.meta.spend ? `
    <div style="margin-bottom:16px;"><span class="spend-tag ${spendCls}">${spendLabel}</span></div>` : ''}
    <div class="category-meta">
      <span>MCC Sales Mix: <strong>${d.meta.mix}</strong>${d.meta.mixNote ? ' <em style="font-style:italic;color:#bbb;text-transform:none;letter-spacing:0;font-size:11px;">(' + d.meta.mixNote + ')</em>' : ''}</span>
      <span>Force Choice Winner: <strong>${d.meta.winner}</strong></span>${d.meta.topLabel ? `
      <span>Other Top Choices: <strong>${d.meta.topLabel}</strong></span>` : ''}
      <span>${typeCount} Image Types</span>
    </div>
    <div class="types-grid">
  `;

  // Sort types: winner first, then top choices, then rest
  const entries = Object.entries(d.types);
  const winnerType = d.meta.winnerType;
  const winnerImage = d.meta.winnerImage;
  const topChoices = d.meta.topChoices || [];
  entries.sort((a, b) => {
    const aIsWinner = a[0] === winnerType;
    const bIsWinner = b[0] === winnerType;
    const aIsTop = topChoices.includes(a[0]);
    const bIsTop = topChoices.includes(b[0]);
    if (aIsWinner) return -1;
    if (bIsWinner) return 1;
    if (aIsTop && !bIsTop) return -1;
    if (!aIsTop && bIsTop) return 1;
    if (aIsTop && bIsTop) return topChoices.indexOf(a[0]) - topChoices.indexOf(b[0]);
    return 0;
  });

  entries.forEach(([typeName, images]) => {
    // Reorder images so winner image is first in the winner column
    let sortedImages = [...images];
    if (typeName === winnerType && winnerImage && sortedImages.includes(winnerImage)) {
      sortedImages = [winnerImage, ...sortedImages.filter(img => img !== winnerImage)];
    }

    html += `<div class="type-column">`;
    const isTop = topChoices.includes(typeName);
    html += `<div class="type-title">${typeName}${typeName === winnerType ? ' ★' : (isTop ? ' ◆' : '')}</div>`;
    html += `<div class="image-stack">`;
    sortedImages.forEach((img, i) => {
      const src = encodeURI(`${cat}/${typeName}/${img}`);
      html += `
        <div class="image-card${typeName === winnerType && i === 0 ? ' winner' : ''}" onclick="openLightbox('${src}', '${cat}', '${typeName}', ${i + 1}, ${sortedImages.length})">
          <img src="${src}" alt="${typeName} ${i + 1}" loading="lazy">
          <div class="label">${i + 1} / ${sortedImages.length}</div>
        </div>
      `;
    });
    html += `</div></div>`;
  });

  html += `</div>`;
  content.innerHTML = html;
}

function openLightbox(src, cat, type, num, total) {
  event.stopPropagation();
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-meta').textContent = `${cat}  ·  ${type}  ·  ${num} of ${total}`;
  lb.classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function toggleNav() {
  document.getElementById('nav').classList.toggle('open');
  document.getElementById('hamburger').classList.toggle('open');
  document.getElementById('nav-overlay').classList.toggle('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

// Auto-select first category
selectCategory(sortedCats[0]);
</script>
</body>
</html>
